<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>RISE COFFEE</title>

    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="cup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z" />
        <path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H16" />
        <path d="M6 21h12" />
      </symbol>
      <symbol id="cutlery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
        <path d="M7 2v20" />
        <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
      </symbol>
      <symbol id="cake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8" />
        <path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1" />
        <path d="M2 21h20" />
        <path d="M7 8v3M12 8v3M17 8v3" />
      </symbol>
      <symbol id="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
      </symbol>
      <symbol id="phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
      </symbol>
      <symbol id="insta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
      </symbol>
      <symbol id="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z" />
        <circle cx="12" cy="10" r="3" />
      </symbol>
      <symbol id="whatsapp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
      </symbol>
      <symbol id="wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0" />
        <path d="M1.42 9a16 16 0 0 1 21.16 0" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </symbol>
      <symbol id="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12" />
        <polyline points="12 5 19 12 12 19" />
      </symbol>
      <symbol id="close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12" />
      </symbol>
    </svg>

    <div class="app">
      <header class="hero" id="top">
        <div class="hero-overlay"></div>
        <div class="hero-inner">
          <div class="st in" id="status"><i></i><span></span></div>
          <h1 class="logo in b" id="brandName"></h1>
          <p class="tag in c" id="tagline"></p>
          <button class="addr in c" id="addr" aria-label="Скопировать адрес">
            <span class="addr-icon"><svg width="16" height="16"><use href="#pin" /></svg></span>
            <span id="address"></span>
          </button>
        </div>
      </header>

      <main class="sheet">
        <section id="menu" data-main>
          <nav class="chips" id="chips" aria-label="Разделы меню"></nav>
          <div id="cats"></div>
        </section>

        <section class="about" id="about" data-main>
          <h2 id="aboutTitle"></h2>
          <p id="aboutText"></p>
          <div class="facts" id="facts"></div>
        </section>

        <section class="ct" id="contacts" data-main>
          <h2>Контакты</h2>
          <div id="contactsList" class="contacts-grid"></div>
        </section>

        <p class="foot" id="foot"></p>
      </main>
    </div>

    <nav class="nav" id="nav" aria-label="Навигация">
      <button class="nb" data-t="menu" aria-current="true">
        <svg width="16" height="16"><use href="#cutlery" /></svg>
        <span>Меню</span>
      </button>
      <button class="nb" data-t="about">
        <svg width="16" height="16"><use href="#heart" /></svg>
        <span>О нас</span>
      </button>
      <button class="nb" data-t="contacts">
        <svg width="16" height="16"><use href="#phone" /></svg>
        <span>Контакты</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Модальное окно товара -->
    <div class="item-modal" id="itemModal" role="dialog" aria-modal="true" aria-labelledby="modalName" hidden>
      <div class="item-modal-backdrop"></div>
      <div class="item-modal-content">
        <button class="item-modal-close" id="modalClose" aria-label="Закрыть">
          <svg width="20" height="20"><use href="#close"/></svg>
        </button>
        <div id="modalCard" class="modal-card"></div>
        <div class="modal-description">
          <p id="modalDesc"></p>
        </div>
      </div>
    </div>

    <!-- Кнопка возврата наверх -->
    <button id="scrollTopBtn" class="scroll-top" type="button" aria-label="Наверх">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </button>

    <script id="data" type="application/json">
      __DATA__
    </script>
    <script src="/script.js"></script>
  </body>
</html>
