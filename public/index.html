<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>RISE COFFEE</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="cup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z" />
        <path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H16" />
        <path d="M8 3v3M12 3v3" />
      </symbol>
      <symbol id="up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 15 7-7 7 7" />
      </symbol>
      <symbol id="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z" />
        <circle cx="12" cy="10" r="3" />
      </symbol>
    </svg>

    <!-- ПЕРВЫЙ ЭКРАН -->
    <header class="hero" id="top">
      <div class="wrap hero-grid">
        <div class="hero-tx">
          <div class="st in" id="status"><i></i><span></span></div>
          <h1 class="logo in b" id="brandName"></h1>
          <p class="tag in b" id="tagline"></p>
          <div class="info in c">
            <button class="addr" id="addr" type="button" aria-label="Скопировать адрес">
              <svg width="16" height="16" aria-hidden="true"><use href="#pin" /></svg>
              <span id="address"></span>
            </button>
            <p id="hours"></p>
            <a id="phone" href="#" hidden></a>
          </div>
          <div class="cta in c">
            <button class="btn solid" type="button" data-t="menu">Смотреть меню</button>
            <a class="btn line" id="routeBtn" href="#" target="_blank" rel="noopener" hidden>Проложить маршрут</a>
          </div>
        </div>
        <figure class="arch in c" id="heroArch" hidden>
          <img id="heroImg" alt="Интерьер кофейни RISE" decoding="async" fetchpriority="high" />
        </figure>
      </div>
    </header>

    <main>
      <!-- МЕНЮ -->
      <section class="menu" id="menu">
        <div class="chips-bar">
          <nav class="wrap cats-nav" id="chips" aria-label="Разделы меню"></nav>
        </div>
        <div class="wrap">
          <p class="note" id="note" hidden>Нажмите на фото блюда, чтобы посмотреть состав</p>
          <div id="cats"></div>
        </div>
      </section>

      <!-- О НАС -->
      <section class="about" id="about">
        <div class="wrap about-in" id="aboutIn">
          <figure class="about-arch" id="aboutArch" hidden>
            <img id="aboutImg" alt="Интерьер кофейни" loading="lazy" decoding="async" />
          </figure>
          <div class="about-tx">
            <h2 id="aboutTitle"></h2>
            <p id="aboutText"></p>
            <div class="facts" id="facts"></div>
          </div>
        </div>
      </section>

      <!-- КОНТАКТЫ -->
      <section class="ct" id="contacts">
        <div class="wrap">
          <h2>Контакты</h2>
          <div id="contactsList"></div>
        </div>
      </section>
    </main>

    <footer class="foot" id="foot"></footer>

    <button class="up" id="up" type="button" data-t="top" aria-label="Наверх">
      <svg width="22" height="22" aria-hidden="true"><use href="#up" /></svg>
    </button>

    <!-- ОКНО С ПОДРОБНОСТЯМИ БЛЮДА -->
    <dialog class="dlg" id="dlg" aria-labelledby="dlgName">
      <button class="x" type="button" data-close aria-label="Закрыть">&times;</button>
      <div class="dlg-body" id="dlgBody">
        <div class="dlg-img" id="dlgImg"></div>
        <div class="dlg-tx">
          <h3 id="dlgName"></h3>
          <p class="price" id="dlgPrice"></p>
          <p class="desc" id="dlgDesc"></p>
        </div>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Сервер подставляет сюда content.json вместо __DATA__ -->
    <script id="data" type="application/json">__DATA__</script>
    <script src="/script.js"></script>
  </body>
</html>
