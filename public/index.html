<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>RISE COFFEE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol
        id="cup"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z" />
        <path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H16" />
        <path d="M8 3v3M12 3v3" />
      </symbol>
      <symbol
        id="go"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M7 17 17 7M8 7h9v9" />
      </symbol>
      <symbol
        id="close"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </symbol>
    </svg>

    <div class="app">
      <header class="hero" id="top">
        <div class="st in" id="status"><i></i><span></span></div>
        <h1 class="logo in b" id="brandName"></h1>
        <p class="tag in c" id="tagline"></p>
        <button class="addr in c" id="addr" aria-label="Скопировать адрес">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          <span id="address"></span>
        </button>
      </header>

      <div class="sheet">
        <section id="menu" data-main>
          <nav class="chips" id="chips" aria-label="Разделы меню"></nav>
          <div id="cats"></div>
        </section>

        <section class="about" id="about" data-main>
          <h2 id="aboutTitle"></h2>
          <p id="aboutText"></p>
          <div class="facts" id="facts"></div>
        </section>

        <section class="ct" id="contacts" data-main>
          <h2>Контакты</h2>
          <div id="contactsList"></div>
          <p class="foot" id="foot"></p>
        </section>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Навигация">
      <button class="nb" data-t="menu" aria-current="true">Меню</button>
      <button class="nb" data-t="about">О нас</button>
      <button class="nb" data-t="contacts">Контакты</button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Модальное окно товара -->
    <div class="item-modal" id="itemModal" role="dialog" aria-modal="true" aria-labelledby="modalName" hidden>
      <div class="item-modal-backdrop"></div>
      <div class="item-modal-content">
        <button class="item-modal-close" id="modalClose" aria-label="Закрыть">
          <svg width="24" height="24"><use href="#close"/></svg>
        </button>
        <div id="modalCard" class="modal-card"></div>
        <div class="modal-description">
          <p id="modalDesc"></p>
        </div>
      </div>
    </div>

    <script id="data" type="application/json">
      __DATA__
    </script>
    <script src="/script.js"></script>
  </body>
</html>
